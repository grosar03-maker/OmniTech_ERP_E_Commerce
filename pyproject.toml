[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]  # inline CSS en templates de email

[tool.ruff.lint.per-file-ignores]
"populate_db.py" = ["E402"]  # imports after django.setup()

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "omnitech.settings"
python_files = ["test_*.py", "*_tests.py"]
testpaths = ["omnitech/tests"]
