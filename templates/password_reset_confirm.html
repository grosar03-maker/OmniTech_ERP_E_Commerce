{% extends 'base.html' %}
{% load static %}

{% block title %}Nueva contrasena - OmniTech{% endblock %}

{% block extra_css %}
<style>
.password-container {
    min-height: calc(100vh - 200px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
}

.password-card {
    background: linear-gradient(135deg, rgba(26, 26, 36, 0.9) 0%, rgba(10, 10, 15, 0.95) 100%);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    padding: 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
}

.password-header {
    text-align: center;
    margin-bottom: 32px;
}

.password-header h1 {
    font-size: 24px;
    font-weight: 700;
    color: #fff;
    margin: 0 0 8px 0;
}

.password-header p {
    font-size: 14px;
    color: #a1a1aa;
    margin: 0;
}

.password-form .form-group {
    margin-bottom: 20px;
}

.password-form label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #a1a1aa;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.password-input-wrapper {
    position: relative;
}

.password-input-wrapper input {
    width: 100%;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 14px 48px 14px 16px;
    font-size: 15px;
    color: #fff;
    transition: all 0.3s ease;
}

.password-input-wrapper input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
}

.password-toggle {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #86868b;
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s ease;
}

.password-toggle:hover {
    color: #fff;
}

.btn-save-password {
    width: 100%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 12px;
}

.btn-save-password:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px -10px rgba(102, 126, 234, 0.5);
}
</style>
{% endblock %}

{% block content %}
<div class="password-container">
    <div class="password-card">
        <div class="password-header">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" style="margin: 0 auto 16px; display: block;">
                <rect x="3" y="11" width="18" height="11" rx="2" stroke="url(#lockGrad)" stroke-width="2"/>
                <path d="M7 11V7a5 5 0 0110 0v4" stroke="url(#lockGrad)" stroke-width="2" stroke-linecap="round"/>
                <defs>
                    <linearGradient id="lockGrad" x1="3" y1="3" x2="21" y2="21">
                        <stop offset="0%" stop-color="#667eea"/>
                        <stop offset="100%" stop-color="#764ba2"/>
                    </linearGradient>
                </defs>
            </svg>
            <h1>Nueva contrasena</h1>
            <p>Ingresa y confirma tu nueva contrasena</p>
        </div>
        
        <form method="POST" class="password-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="password">Nueva contrasena</label>
                <div class="password-input-wrapper">
                    <input type="password" id="password" name="password" required minlength="8" placeholder="Minimo 8 caracteres">
                    <button type="button" class="password-toggle" onclick="togglePassword('password', 'toggle1')">
                        <svg id="toggle1" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password2">Confirmar contrasena</label>
                <div class="password-input-wrapper">
                    <input type="password" id="password2" name="password2" required minlength="8" placeholder="Repite tu contrasena">
                    <button type="button" class="password-toggle" onclick="togglePassword('password2', 'toggle2')">
                        <svg id="toggle2" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>
            
            <button type="submit" class="btn-save-password">
                Guardar contrasena
            </button>
        </form>
    </div>
</div>

<script>
function togglePassword(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    
    if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.72a3 3 0 01-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
    } else {
        input.type = 'password';
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }
}
</script>
{% endblock %}
