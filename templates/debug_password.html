<!DOCTYPE html>
<html>
<head>
    <title>Debug Password</title>
    <style>
        body { font-family: sans-serif; padding: 40px; background: #000; color: #fff; }
        .container { max-width: 400px; margin: 0 auto; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #333; background: #111; color: #fff; }
        button { width: 100%; padding: 12px; margin-top: 16px; background: #667eea; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
        pre { background: #111; padding: 16px; border-radius: 8px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Debug Password</h1>
        <form id="debugForm">
            <input type="text" name="username" placeholder="Usuario" required>
            <input type="password" name="new_password" placeholder="Nueva contrasena" required>
            <button type="submit">Cambiar Contrasena</button>
        </form>
        <pre id="result"></pre>
    </div>
    <script>
        document.getElementById('debugForm').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const response = await fetch('/debug-password/', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            document.getElementById('result').textContent = JSON.stringify(data, null, 2);
        };
    </script>
</body>
</html>
