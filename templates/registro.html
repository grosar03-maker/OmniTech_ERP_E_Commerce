{% extends 'base.html' %}
{% load static %}

{% block title %}Registrarse - OmniTech{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container glass-card">
        <div class="auth-header">
            <h1>Crear Cuenta</h1>
            <p>Únete a OmniTech y disfruta de beneficios exclusivos</p>
        </div>
        
        <form method="POST" action="{% url 'registro' %}" class="auth-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username">Nombre de usuario</label>
                <input type="text" id="username" name="username" class="form-input" required autofocus
                       placeholder="Ej: usuario123">
            </div>
            
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" class="form-input" required
                       placeholder="tu@correo.com">
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" class="form-input" required
                       placeholder="Mínimo 8 caracteres">
            </div>
            
            <div class="form-group">
                <label for="password2">Confirmar contraseña</label>
                <input type="password" id="password2" name="password2" class="form-input" required
                       placeholder="Repite tu contraseña">
            </div>
            
            <div class="form-terms">
                <label class="checkbox-label">
                    <input type="checkbox" required>
                    <span>Acepto los <a href="#">Términos de Servicio</a> y la <a href="#">Política de Privacidad</a></span>
                </label>
            </div>
            
            <button type="submit" class="btn-auth">Crear Cuenta</button>
        </form>
        
        <div class="auth-footer">
            <p>¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
        </div>
    </div>
</section>
{% endblock %}
